<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Nexus</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- লগইন / সাইনআপ -->
<div id="auth" class="auth hidden">
  <div class="auth-box">
    <div class="auth-logo">Nexus</div>
    <p class="auth-sub">বন্ধুদের সাথে যুক্ত থাকুন, নিজের কথা শেয়ার করুন।</p>
    <div class="tabs">
      <button id="tabLogin" class="tab active" type="button">লগইন</button>
      <button id="tabSignup" class="tab" type="button">নতুন অ্যাকাউন্ট</button>
    </div>
    <form id="authForm" autocomplete="on">
      <input id="aName" type="text" placeholder="আপনার নাম" maxlength="40" class="hidden" autocomplete="name">
      <input id="aEmail" type="email" placeholder="ইমেইল" required autocomplete="email">
      <input id="aPass" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" required minlength="6" autocomplete="current-password">
      <button id="aSubmit" class="btn primary" type="submit">লগইন করুন</button>
    </form>
    <p id="aError" class="error"></p>
  </div>
</div>

<!-- মূল অ্যাপ -->
<div id="app" class="hidden">
  <header class="top">
    <div class="top-inner">
      <div class="logo" id="logoBtn">Nexus</div>
      <nav>
        <button id="navHome" class="nav-btn" type="button">🏠 <span>হোম</span></button>
        <button id="navProfile" class="nav-btn" type="button">👤 <span>প্রোফাইল</span></button>
        <button id="navLogout" class="nav-btn" type="button">🚪 <span>লগআউট</span></button>
      </nav>
    </div>
  </header>
  <main id="main" class="main"></main>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="app.js"></script>
</body>
</html>
